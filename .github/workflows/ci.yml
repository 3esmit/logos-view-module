name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: logos-co
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: View glue generation
        run: nix build '.#checks.x86_64-linux.view-generator'

      - name: Malformed .rep is rejected
        run: nix build '.#checks.x86_64-linux.view-generator-rejects-bad-rep'

      # The templates in cmake/ are the module side of a plugin ABI whose host
      # side lives in logos-view-module-runtime. This builds a factory from
      # them, asserts the exact IID in the binary, then QPluginLoaders it and
      # performs the same qobject_cast ui-host does.
      - name: .rep replica factory builds, loads and casts
        run: nix build '.#checks.x86_64-linux.rep-file-plugin'
